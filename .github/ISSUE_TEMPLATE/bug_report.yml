name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API tokens, secrets or real project data. For security issues use the private reporting link instead.
  - type: input
    id: version
    attributes:
      label: Server version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: toolsets
    attributes:
      label: Enabled toolsets and affected tool
      placeholder: "core, info, actions, ssh_keys; server_create"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: "22.x, macOS"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Desktop, Cursor, ..."
  - type: textarea
    id: config
    attributes:
      label: Configuration (without secrets)
      description: Relevant HETZNER_MCP_* variables. Never include HETZNER_TOKEN.
      render: shell
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: stderr output, ideally with HETZNER_MCP_LOG_LEVEL=debug. Remove secrets and project data.
      render: text
